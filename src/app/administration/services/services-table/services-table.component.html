<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div
        class="single-card-dashboard account-info box-dashboard-dashboard d-flex align-items-center justify-content-between">
        <h3 class="title title-top-primary"><i class="fa-solid fa-cogs"></i> Services</h3>
        <div class="d-flex gap-3">
            <a routerLink="../add-service-detail" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
               <span class="icon-reverse-wrapper">
                   <span class="btn-text">Add Service Details</span>
                   <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
                   <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
               </span>
           </a>
           <a routerLink="../add-service" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
               <span class="icon-reverse-wrapper">
                   <span class="btn-text">Add Service</span>
                   <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
                   <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
               </span>
           </a>
        </div>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">

        <div class="invers-dashboard-table table-responsive mobile-table-750">
            <table class="invers-table table table-borderless">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngIf="loading">
                        <td colspan="3" class="text-center">Loading services...</td>
                    </tr>
                    <tr *ngIf="error">
                        <td colspan="3" class="text-center text-danger" style="white-space: pre-line;">{{ error }}</td>
                    </tr>
                    <tr *ngIf="!loading && !error && services.length === 0">
                        <td colspan="3" class="text-center">No services found.</td>
                    </tr>
                    <tr *ngFor="let service of services">
                        <th>{{ service.title }}</th>
                        <td>{{ service.description.length > 80 ? (service.description | slice:0:80) + '...' :
                            service.description }}</td>
                        <td>
                            <div class="d-flex gap-3">
                                <a [routerLink]="['../add-service']" [queryParams]="{ id: service.id }" role="button"
                                    class="text-primary"><i class="fa-regular fa-pen-to-square"></i> Edit</a>
                                <a href="javascript:void(0)" role="button" class="text-danger"
                                    (click)="deleteService(service.id!)"><i class="fa-regular fa-trash-can"></i>
                                    Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>
