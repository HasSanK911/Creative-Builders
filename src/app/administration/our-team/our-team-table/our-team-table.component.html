<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div
        class="single-card-dashboard account-info box-dashboard-dashboard d-flex align-items-center justify-content-between">
        <h3 class="title title-top-primary"><i class="fa-regular fa-users"></i> Our Team</h3>
        <a routerLink="../add-team-member" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
            <span class="icon-reverse-wrapper">
                <span class="btn-text">Add Team Member</span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
            </span>
        </a>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">

        <div class="invers-dashboard-table table-responsive mobile-table-750">
            <table class="invers-table table table-borderless">
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Site</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let member of members">
                        <td>
                            <img *ngIf="member.photo" [src]="member.photo" [alt]="member.name"
                                style="width: 60px; height: 60px; object-fit: cover; border-radius: 50%;">
                        </td>
                        <th>{{ member.name }}</th>
                        <td>{{ member.position }}</td>
                        <td>{{ member.email }}</td>
                        <td>{{ member.phone }}</td>
                        <th>{{ member.siteName }}</th>
                        <td>
                            <div class="d-flex gap-3">
                                <a [routerLink]="['../add-team-member']" [queryParams]="{ id: member.id }"
                                    role="button" class="text-primary"><i class="fa-regular fa-pen-to-square"></i>
                                    Edit</a>
                                <a href="javascript:void(0)" (click)="remove(member)" role="button"
                                    class="text-danger"><i class="fa-regular fa-trash-can"></i>
                                    Delete</a>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="loading">
                        <td colspan="7" class="text-center">Loading team members...</td>
                    </tr>
                    <tr *ngIf="error && !loading">
                        <td colspan="7" class="text-center text-danger" style="white-space: pre-line;">{{ error }}</td>
                    </tr>
                    <tr *ngIf="!loading && !error && members.length === 0">
                        <td colspan="7" class="text-center">No team members found.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>
