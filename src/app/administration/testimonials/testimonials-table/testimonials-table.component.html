<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">
    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="title title-top-primary"><i class="fa-solid fa-quote-left"></i> Testimonials</h3>
            <a routerLink="/admin/add-testimonials" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
                <span class="icon-reverse-wrapper"><span class="btn-text">Add Testimonial</span>
                    <span class="btn-icon"><i class="fa-solid fa-plus"></i></span>
                    <span class="btn-icon"><i class="fa-solid fa-plus"></i></span></span>
            </a>
        </div>
    </div>
    <div class="single-card-dashboard box-dashboard-dashboard">
        <div *ngIf="message" class="alert alert-danger" style="margin-bottom:12px;">{{ message }}</div>
        <div *ngIf="isLoading" style="text-align:center;padding:40px;">Loading...</div>
        <div *ngIf="!isLoading && testimonials.length === 0" style="text-align:center;padding:40px;color:#999;">
            <i class="fa-solid fa-quote-left" style="font-size:40px;display:block;margin-bottom:10px;"></i>
            No testimonials yet. <a routerLink="/admin/add-testimonials">Add one!</a>
        </div>
        <div class="invers-dashboard-table table-responsive mobile-table-750"
            *ngIf="!isLoading && testimonials.length > 0">
            <table class="invers-table table table-borderless">
                <thead>
                    <tr>
                        <th style="width: 100px;">Photo</th>
                        <th style="width: 15%;">Client</th>
                        <th style="width: 15%;">Designation</th>
                        <th style="width: 100px;">Rating</th>
                        <th>Feedback</th>
                        <th style="width: 150px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let t of testimonials">
                        <td>
                            <img *ngIf="t.image_url" [src]="t.image_url" alt="Photo"
                                style="width:45px;height:45px;border-radius:50%;object-fit:cover;">
                            <i *ngIf="!t.image_url" class="fa-solid fa-user" style="font-size:30px;color:#ccc;"></i>
                        </td>
                        <th>{{ t.client_name }}</th>
                        <td>{{ t.designation }}</td>
                        <td>{{ t.rating }}⭐</td>
                        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{
                            t.feedback
                            }}</td>
                        <td>
                            <div class="d-flex gap-3 align-items-center">
                                <a [routerLink]="['/admin/edit-testimonials', t.id]" role="button" class="text-primary"
                                    style="display: flex; align-items: center; gap: 4px;">
                                    <i class="fa-regular fa-pen-to-square"></i>Edit</a>
                                <a role="button" class="text-danger" (click)="deleteTestimonial(t.id)"
                                    style="display: flex; align-items: center; gap: 4px;">
                                    <i class="fa-regular fa-trash-can"></i>Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
