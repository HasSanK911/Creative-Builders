<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div
        class="single-card-dashboard account-info box-dashboard-dashboard d-flex align-items-center justify-content-between">
        <h3 class="title title-top-primary"><i class="fa-solid fa-quote-left"></i> Testimonials</h3>
        <a routerLink="../add-testimonials" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
            <span class="icon-reverse-wrapper">
                <span class="btn-text">Add Testimonial</span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
            </span>
        </a>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">

        <table class="invers-table table table-borderless">
            <thead>
                <tr>
                    <th>Client Name</th>
                    <th>Designation</th>
                    <th>Feedback</th>
                    <th>Rating</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let testimonial of testimonials">
                    <th>{{ testimonial.clientName }}</th>
                    <td>{{ testimonial.designation }}</td>
                    <td>{{ testimonial.feedback }}</td>
                    <td>{{ stars(testimonial.rating) }}</td>
                    <td>
                        <div class="d-flex gap-3">
                            <a [routerLink]="['../add-testimonials']" [queryParams]="{ id: testimonial.id }"
                                class="cursor-pointer d-flex gap-1 align-items-center text-primary">
                                <i class="fa-regular fa-pen-to-square"></i> Edit
                            </a>
                            <a href="javascript:void(0)" (click)="remove(testimonial)"
                                class="cursor-pointer d-flex gap-1 align-items-center text-danger">
                                <i class="fa-light fa-trash-can"></i> Delete
                            </a>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="loading">
                    <td colspan="5" class="text-center">Loading testimonials...</td>
                </tr>
                <tr *ngIf="error && !loading">
                    <td colspan="5" class="text-center text-danger" style="white-space: pre-line;">{{ error }}</td>
                </tr>
                <tr *ngIf="!loading && !error && testimonials.length === 0">
                    <td colspan="5" class="text-center">No testimonials found.</td>
                </tr>
            </tbody>
        </table>

    </div>

</div>
