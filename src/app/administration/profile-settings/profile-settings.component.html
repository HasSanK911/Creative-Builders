<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <h3 class="title title-top-primary"><i class="fa-regular fa-building mr-10"></i> Company Information
        </h3>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <h3 class="title with-border-bottom">Company Details</h3>

        <div class="edit-profile-picture-area">
            <div class="upload-wrapper">
                <div class="image-preview" id="imagePreview">
                    <img src="assets/images/profile/02.webp" alt="Company Logo" id="previewImage">
                </div>
                <div class="upload-action">
                    <a href="javascript:void(0)" class="tmp-btn btn-border hover-icon-reverse invers-uploadBtnActive"
                        id="uploadBtn">
                        <span class="icon-reverse-wrapper">
                            <span class="btn-text">Upload Company Logo</span>
                            <span class="btn-icon"><i class="fa-light fa-cloud-arrow-up"></i></span>
                            <span class="btn-icon"><i class="fa-light fa-cloud-arrow-up"></i></span>
                        </span>
                    </a>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
            </div>

            <div class="edit-account-information">
                <form (ngSubmit)="updateCompany()">
                    <div class="input-wrapper">
                        <div class="single-input">
                            <label for="company_name">Company Name*</label>
                            <input type="text" id="company_name" name="company_name" placeholder="Enter Company Name"
                                [(ngModel)]="company.company_name" required>
                        </div>
                        <div class="single-input">
                            <label for="email">Company Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter Company Email"
                                [(ngModel)]="company.email">
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <div class="single-input">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter Phone Number"
                                [(ngModel)]="company.phone">
                        </div>
                    </div>

                    <div *ngIf="message" class="alert"
                        [ngClass]="{'alert-success': message.includes('successfully'), 'alert-danger': !message.includes('successfully')}">
                        {{ message }}
                    </div>

                    <button type="submit" class="tmp-btn btn-primary hover-icon-reverse btn-sm" [disabled]="isLoading">
                        <span class="icon-reverse-wrapper">
                            <span class="btn-text">{{ isLoading ? 'Saving...' : 'Save Changes' }}</span>
                            <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                            <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
