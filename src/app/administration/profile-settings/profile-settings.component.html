<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <h3 class="title title-top-primary"><i class="fa-regular fa-pen-to-square mr-10"></i> Edit Personal Information
        </h3>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <h3 class="title with-border-bottom">Account Informarion</h3>

        <div *ngIf="loading" class="mb--20" style="color: var(--color-body);">
            <i class="fa-solid fa-spinner fa-spin mr--5"></i> Loading profile...
        </div>

        <div *ngIf="error" class="alert alert-danger mb--20" role="alert"
            style="color: #dc3545; background: rgba(220,53,69,.08); border-radius: 6px; padding: 10px 14px; white-space: pre-line;">
            {{ error }}
        </div>

        <div *ngIf="success" class="alert alert-success mb--20" role="alert"
            style="color: #198754; background: rgba(25,135,84,.08); border-radius: 6px; padding: 10px 14px;">
            {{ success }}
        </div>

        <div class="edit-profile-picture-area">
            <div class="upload-wrapper">
                <div class="image-preview" id="imagePreview">
                    <img [src]="logoPreview" alt="Preview" id="previewImage">
                </div>
                <div class="upload-action">
                    <!-- <button class="tmp-btn btn-primary" id="uploadBtn">Upload Image</button> -->

                    <a href="javascript:void(0)" class="tmp-btn btn-border hover-icon-reverse invers-uploadBtnActive"
                        id="uploadBtn" (click)="logoInput.click()">
                        <span class="icon-reverse-wrapper">
                            <span class="btn-text">Upload Logo</span>
                            <span class="btn-icon"><i class="fa-light fa-cloud-arrow-up"></i></span>
                            <span class="btn-icon"><i class="fa-light fa-cloud-arrow-up"></i></span>
                        </span>
                    </a>
                    <input type="file" #logoInput id="fileInput" accept="image/*" (change)="onLogoSelected($event)">
                </div>
            </div>

            <div class="edit-account-information">
                <form action="#" (ngSubmit)="save()">
                    <div class="input-wrapper">
                        <div class="single-input">
                            <label for="name">Name*</label>
                            <input type="text" id="name" name="name" placeholder="Enter Your Name"
                                [(ngModel)]="profile.name" required>
                        </div>
                        <div class="single-input">
                            <label for="email">Email*</label>
                            <input type="email" id="email" name="email" placeholder="Enter Your Email"
                                [(ngModel)]="profile.email" required>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <div class="single-input">
                            <label for="companyName">Company Name*</label>
                            <input type="text" id="companyName" name="companyName" placeholder="Enter Company Name"
                                [(ngModel)]="profile.companyName" required>
                        </div>
                        <div class="single-input">
                            <label for="phone">Mobile Number*</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter Mobile Number"
                                pattern="[+0-9 ]{7,20}" [(ngModel)]="profile.phone" required>
                        </div>
                    </div>

                    <button type="submit" class="tmp-btn btn-primary hover-icon-reverse btn-sm"
                        [disabled]="saving || loading">
                        <span class="icon-reverse-wrapper">
                            <span class="btn-text">{{ saving ? 'Saving...' : 'Save Changes' }}</span>
                            <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                            <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
