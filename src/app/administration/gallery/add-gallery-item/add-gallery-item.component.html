<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <h3 class="title title-top-primary"><i class="fa-regular fa-images"></i> {{ heading }}</h3>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">

        <div class="edit-account-information">
            <p *ngIf="loading" class="text-center">Loading gallery image...</p>
            <p *ngIf="error" class="text-danger" style="white-space: pre-line;">{{ error }}</p>

            <form action="#" (ngSubmit)="save()">
                <!-- Multiple Image Upload -->
                <div class="edit-profile-picture-area mb--20">
                    <div class="upload-wrapper">
                        <div class="image-preview-container" id="imagePreviewContainer"
                            style="width: 100%; min-height: 250px; border: 2px dashed var(--color-border); border-radius: 8px; padding: 15px; background: var(--color-lightest);">
                            <div id="imagePreviewGrid"
                                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;">
                                <div class="image-preview-item" *ngFor="let preview of previews; let i = index"
                                    style="position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1/1; border: 2px solid var(--color-border);">
                                    <img [src]="preview.url" [alt]="preview.file.name" [title]="preview.file.name"
                                        style="width: 100%; height: 100%; object-fit: cover;">
                                    <button type="button" (click)="removeImage(i)" (mouseenter)="hoveredPreview = i"
                                        (mouseleave)="hoveredPreview = null"
                                        [style.transform]="hoveredPreview === i ? 'scale(1.1)' : 'scale(1)'"
                                        style="position: absolute; top: 5px; right: 5px; background: rgba(220, 53, 69, 0.9); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: transform 0.2s;">
                                        <i class="fa-solid fa-times"></i>
                                    </button>
                                </div>

                                <div class="image-preview-item" *ngIf="existingImage && !previews.length"
                                    style="position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1/1; border: 2px solid var(--color-border);">
                                    <img [src]="existingImage" alt="Preview"
                                        style="width: 100%; height: 100%; object-fit: cover;">
                                </div>

                                <div id="placeholderText" *ngIf="!previews.length && !existingImage"
                                    style="color: var(--color-body); font-size: 14px; text-align: center; padding: 40px; grid-column: 1/-1;">
                                    <i class="fa-solid fa-cloud-arrow-up"
                                        style="font-size: 40px; display: block; margin-bottom: 10px;"></i>
                                    Click "Upload Images" to select multiple photos
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="upload-action d-flex justify-content-end mt--15">
                        <a href="javascript:void(0)" class="tmp-btn btn-border hover-icon-reverse" id="uploadBtn"
                            (click)="fileInput.click()">
                            <span class="icon-reverse-wrapper">
                                <span class="btn-text">{{ uploadLabel }}</span>
                                <span class="btn-icon"><i class="fa-light fa-cloud-arrow-up"></i></span>
                                <span class="btn-icon"><i class="fa-light fa-cloud-arrow-up"></i></span>
                            </span>
                        </a>
                        <input type="file" id="fileInput" #fileInput accept="image/*" [multiple]="!id"
                            (change)="onFilesSelected($event)" style="display: none;">
                    </div>
                </div>

                <div class="input-wrapper">
                    <div class="single-input">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" [(ngModel)]="title"
                            placeholder="e.g., Foundation Work" autocomplete="off">
                    </div>
                </div>

                <div class="input-wrapper">
                    <div class="single-input">
                        <label>Select Site*</label>
                        <div class="invers-modern-select">
                            <div class="select">
                                <div class="selectBtn" [class.toggle]="isSiteDropdownOpen"
                                    (click)="isSiteDropdownOpen = !isSiteDropdownOpen">{{ selectedSiteName || 'Select Site' }}</div>
                                <div class="selectDropdown" [class.toggle]="isSiteDropdownOpen"
                                    *ngIf="isSiteDropdownOpen" style="display: block;">
                                    <div class="option" *ngFor="let site of sites" (click)="selectSite(site)">{{ site.name }}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center mt--20">
                    <button type="submit" class="tmp-btn btn-primary hover-icon-reverse btn-sm" [disabled]="saving">
                        <span class="icon-reverse-wrapper">
                            <span class="btn-text">{{ saveLabel }}</span>
                            <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                            <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                        </span>
                    </button>
                </div>
            </form>

        </div>

    </div>

</div>
