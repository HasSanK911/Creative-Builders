<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div
        class="single-card-dashboard account-info box-dashboard-dashboard d-flex align-items-center justify-content-between">
        <h3 class="title title-top-primary"><i class="fa-regular fa-images"></i> Gallery</h3>
        <a routerLink="../add-gallery-item" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
            <span class="icon-reverse-wrapper">
                <span class="btn-text">Add Gallery Images</span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
            </span>
        </a>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">

        <div class="invers-dashboard-table table-responsive mobile-table-750">
            <table class="invers-table table table-borderless">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Site</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let item of items">
                        <td>
                            <img *ngIf="item.image" [src]="item.image" [alt]="item.title || 'Gallery image'"
                                style="width: 80px; height: 60px; object-fit: cover; border-radius: 4px;">
                        </td>
                        <th>{{ item.title }}</th>
                        <th>{{ item.siteName }}</th>
                        <td>
                            <div class="d-flex gap-3">
                                <a [routerLink]="['../add-gallery-item']" [queryParams]="{ id: item.id }" role="button"
                                    class="text-primary"><i class="fa-regular fa-pen-to-square"></i> Edit</a>
                                <a href="javascript:void(0)" (click)="remove(item)" role="button"
                                    class="text-danger"><i class="fa-regular fa-trash-can"></i>
                                    Delete</a>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="loading">
                        <td colspan="4" class="text-center">Loading gallery...</td>
                    </tr>
                    <tr *ngIf="error && !loading">
                        <td colspan="4" class="text-center text-danger" style="white-space: pre-line;">{{ error }}</td>
                    </tr>
                    <tr *ngIf="!loading && !error && items.length === 0">
                        <td colspan="4" class="text-center">No gallery images found.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>
