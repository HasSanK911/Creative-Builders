<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">
    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="title title-top-primary"><i class="fa-regular fa-images"></i> Gallery</h3>
            <a routerLink="/admin/add-gallery-item" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
                <span class="icon-reverse-wrapper"><span class="btn-text">Add Images</span>
                    <span class="btn-icon"><i class="fa-solid fa-plus"></i></span>
                    <span class="btn-icon"><i class="fa-solid fa-plus"></i></span></span>
            </a>
        </div>
    </div>
    <div class="single-card-dashboard box-dashboard-dashboard">
        <div *ngIf="message" class="alert alert-danger" style="margin-bottom:12px;">{{ message }}</div>
        <div *ngIf="isLoading" style="text-align:center;padding:40px;">Loading...</div>
        <div *ngIf="!isLoading && galleries.length === 0" style="text-align:center;padding:40px;color:#999;">
            <i class="fa-regular fa-images" style="font-size:40px;display:block;margin-bottom:10px;"></i>
            No gallery images yet. <a routerLink="/admin/add-gallery-item">Add some!</a>
        </div>
        <div class="invers-dashboard-table table-responsive mobile-table-750"
            *ngIf="!isLoading && galleries.length > 0">
            <table class="invers-table table table-borderless">
                <thead>
                    <tr>
                        <th style="width:180px;">Site</th>
                        <th>Previews</th>
                        <th style="width: 12%;">Count</th>
                        <th style="width: 160px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let batch of galleries">
                        <td style="vertical-align:middle;padding-top:10px;">
                            <span *ngIf="batch.site_name"
                                style="display:inline-flex;align-items:center;gap:5px;background:var(--color-primary);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">
                                <i class="fa-solid fa-location-dot"></i> {{ batch.site_name }}
                            </span>
                            <span *ngIf="!batch.site_name" style="color:#aaa;font-size:12px;font-style:italic;">Not
                                assigned</span>
                        </td>
                        <td>
                            <div style="display:flex;flex-wrap:wrap;gap:6px;">
                                <img *ngFor="let img of (batch.images || [])" [src]="img" alt="Gallery"
                                    (click)="openPreview(img)"
                                    style="width:70px;height:70px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid var(--color-border);transition:transform .2s;"
                                    onmouseover="this.style.transform='scale(1.08)'"
                                    onmouseout="this.style.transform='scale(1)'">
                            </div>
                        </td>
                        <td>{{ (batch.images || []).length }}</td>
                        <td>
                            <div class="d-flex gap-3 align-items-center">
                                <a role="button" class="text-primary"
                                    [routerLink]="['/admin/edit-gallery-item', batch.id]"
                                    style="display:flex;align-items:center;gap:4px;">
                                    <i class="fa-regular fa-pen-to-square"></i>Edit</a>
                                <a role="button" class="text-danger" (click)="deleteGallery(batch.id)"
                                    style="display:flex;align-items:center;gap:4px;">
                                    <i class="fa-regular fa-trash-can"></i>Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Lightbox Preview -->
<div *ngIf="previewUrl" (click)="closePreview()"
    style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;">
    <img [src]="previewUrl" style="max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,.5);"
        (click)="$event.stopPropagation()">
    <button (click)="closePreview()"
        style="position:fixed;top:20px;right:24px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;">✕</button>
</div>
