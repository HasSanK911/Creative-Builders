<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">
    <div class="single-card-dashboard account-info box-dashboard-dashboard">
        <div class="d-flex justify-content-between align-items-center">
            <h3 class="title title-top-primary"><i class="fa-regular fa-pen-to-square"></i> Edit Gallery</h3>
            <a routerLink="/admin/gallery-item-list" class="tmp-btn btn-border hover-icon-reverse btn-sm">
                <span class="icon-reverse-wrapper"><span class="btn-text">Back</span>
                    <span class="btn-icon"><i class="fa-solid fa-arrow-left"></i></span>
                    <span class="btn-icon"><i class="fa-solid fa-arrow-left"></i></span>
                </span>
            </a>
        </div>
    </div>

    <div *ngIf="message" class="single-card-dashboard account-info box-dashboard-dashboard">
        <div class="alert" [ngClass]="message.includes('success') ? 'alert-success' : 'alert-danger'">{{ message }}
        </div>
    </div>

    <div class="single-card-dashboard account-info box-dashboard-dashboard" *ngIf="!batch">
        <div style="text-align:center;padding:40px;color:#999;">
            <i class="fa-regular fa-images" style="font-size:40px;display:block;margin-bottom:10px;"></i>
            Loading gallery...
        </div>
    </div>

    <div class="single-card-dashboard account-info box-dashboard-dashboard" *ngIf="batch">
        <div class="edit-account-information">

            <!-- Assign Site -->
            <div class="row mb--25">
                <div class="col-lg-6">
                    <label class="form-label" style="font-weight:600;">Assign to Site / Project</label>
                    <select class="form-control" [(ngModel)]="selectedSiteId" name="siteId"
                        style="padding:10px 15px;border-radius:8px;border:1px solid var(--color-border);background:var(--color-bg);">
                        <option [ngValue]="null">— No Site —</option>
                        <option *ngFor="let site of sites" [ngValue]="site.id">{{ site.name }}</option>
                    </select>
                </div>
            </div>

            <!-- Existing Images -->
            <div class="mb--20">
                <label class="form-label" style="font-weight:600;">
                    Current Images
                    <span class="text-muted" style="font-weight:400;font-size:12px;margin-left:6px;">Click ✕ to
                        remove</span>
                </label>
                <div *ngIf="existingImages.length === 0" style="color:#aaa;font-size:13px;padding:10px 0;">
                    No images — add some below.
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:10px;">
                    <div *ngFor="let img of existingImages; let i = index"
                        style="position:relative;width:110px;height:110px;">
                        <img [src]="img" alt="Gallery"
                            style="width:100%;height:100%;object-fit:cover;border-radius:8px;border:2px solid var(--color-border);">
                        <button type="button" (click)="removeExisting(i)"
                            style="position:absolute;top:-8px;right:-8px;background:#dc3545;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
                    </div>
                </div>
            </div>

            <!-- Add New Images -->
            <div class="mb--25">
                <label class="form-label" style="font-weight:600;">Add New Images</label>
                <div>
                    <label
                        style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:8px 18px;border:2px dashed var(--color-border);border-radius:8px;font-size:14px;color:var(--color-body);">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Choose Images
                        <input type="file" accept="image/*" multiple style="display:none;"
                            (change)="onFilesSelected($event)">
                    </label>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;" *ngIf="newPreviews.length > 0">
                    <div *ngFor="let preview of newPreviews; let i = index"
                        style="position:relative;width:110px;height:110px;">
                        <img [src]="preview" alt="New"
                            style="width:100%;height:100%;object-fit:cover;border-radius:8px;border:2px dashed #28a745;">
                        <button type="button" (click)="removeNew(i)"
                            style="position:absolute;top:-8px;right:-8px;background:#dc3545;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
                        <span
                            style="position:absolute;bottom:4px;left:4px;background:#28a745;color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;">NEW</span>
                    </div>
                </div>
            </div>

            <!-- Save -->
            <div class="d-flex justify-content-center mt--20">
                <button type="button" class="tmp-btn btn-primary hover-icon-reverse btn-sm" (click)="save()"
                    [disabled]="isSaving">
                    <span class="icon-reverse-wrapper">
                        <span class="btn-text">{{ isSaving ? 'Saving...' : 'Save Changes' }}</span>
                        <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                        <span class="btn-icon"><i class="fa-solid fa-bookmark"></i></span>
                    </span>
                </button>
            </div>

        </div>
    </div>
</div>
