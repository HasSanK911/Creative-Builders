<app-header (menuToggle)="toggleSidebar()"></app-header>

<!-- user dashboard area start -->
<div class="pb-4">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-3 col-xl-2 admin-sidebar-col" [class.open]="sidebarOpen" id="admin-sidebar">
                <div class="user-infor-left-sidebar-dashboard admin-sidebar">
                    <div class="author-profile d-flex align-items-center justify-content-between">
                        <h3 class="name mb-0">{{ adminName }}</h3>
                        <button type="button" class="admin-sidebar-close" (click)="closeSidebar()"
                            aria-label="Close menu">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="dashboard-menu-area">
                        <nav class="dashboard-mainmenu">
                            <ul>
                                <li><a routerLink="dashboard" routerLinkActive="active"><i
                                            class="fa-regular fa-user"></i> Dashboard</a></li>
                                <li><a routerLink="profile-settings" routerLinkActive="active"><i
                                            class="fa-regular fa-user"></i> Profile Settings</a></li>
                                <li><a routerLink="site-list" routerLinkActive="active"><i
                                            class="fa-regular fa-user-pen"></i> My Sites</a></li>
                                <li><a routerLink="site-info-table" routerLinkActive="active"><i
                                            class="fa-regular fa-bag-shopping"></i> Sites Info</a></li>
                                <li><a routerLink="instant-entry" routerLinkActive="active"><i
                                            class="fa-solid fa-bolt"></i> Instant Entry</a></li>
                                <li><a routerLink="materials-list" routerLinkActive="active"><i
                                            class="fa-regular fa-address-card"></i> Materials</a></li>
                                <li><a routerLink="gallery-item-list" routerLinkActive="active"><i
                                            class="fa-light fa-treasure-chest"></i> Gallery</a></li>
                                <li><a routerLink="team-member-list" routerLinkActive="active"><i
                                            class="fa-regular fa-heart"></i> Our Team</a></li>
                                <li><a routerLink="service-list" routerLinkActive="active"><i
                                            class="fa-solid fa-cogs"></i> Services</a></li>
                                <li><a routerLink="why-choose-us" routerLinkActive="active"><i
                                            class="fa-solid fa-check-circle"></i> Why Choose Us</a></li>
                                <li><a routerLink="testimonials-list" routerLinkActive="active"><i
                                            class="fa-solid fa-quote-left"></i> Testimonials</a></li>
                                <li><a routerLink="faq-list" routerLinkActive="active"><i
                                            class="fa-solid fa-question-circle"></i> FAQ</a></li>
                                <li><a routerLink="banner-list" routerLinkActive="active"><i
                                            class="fa-solid fa-image"></i> Banner</a></li>
                                <li><a routerLink="company-details" routerLinkActive="active"><i
                                            class="fa-solid fa-building"></i> About Company</a></li>
                                <li><a routerLink="contact-details" routerLinkActive="active"><i
                                            class="fa-solid fa-envelope"></i> Contact Us</a></li>
                                <li><a routerLink="contact-queries-list" routerLinkActive="active"><i
                                            class="fa-solid fa-inbox"></i> Contact Queries</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
            <div class="col-lg-9 col-xl-10">
                <div class="maindiv w-100">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- user dashboard area end -->

<!-- Dims the page behind the drawer; tapping it closes the menu. -->
<div class="admin-backdrop" [class.show]="sidebarOpen" (click)="closeSidebar()"></div>

<div class="mouse-cursor cursor-outer"></div>
<div class="mouse-cursor cursor-inner"></div>
<div id="anywhere-home" class="">
</div>
