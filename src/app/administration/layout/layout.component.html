<app-header></app-header>

<!-- user dashboard area start -->
<div class="pb-4">
    <div class="container-fluid">
        <div class="row row-sticky">
            <div class="col-lg-3 col-xl-2 col-sticky">
                <div class="user-infor-left-sidebar-dashboard">
                    <!-- <div class="author-profile">
                        <h3 class="name">Mr. Chaudhry Waqas</h3>
                    </div> -->
                    <div class="dashboard-menu-area">
                        <nav class="dashboard-mainmenu">
                            <ul>
                                <ng-container *ngFor="let section of menuSections">
                                    <li class="section-title-item" (click)="toggleSection(section)"
                                        [class.active-section]="section.expanded">
                                        <a href="javascript:void(0)"
                                            class="d-flex justify-content-between align-items-center">
                                            <span class="text-uppercase fw-bold section-text">{{ section.title }}</span>
                                            <i class="fa-solid fa-chevron-down section-icon"
                                                [class.rotate-icon]="section.expanded"></i>
                                        </a>
                                    </li>
                                    <!-- Children - displayed if expanded with animation wrapper -->
                                    <div class="submenu-wrapper" [class.expanded]="section.expanded">
                                        <ul class="submenu-list">
                                            <li *ngFor="let item of section.items">
                                                <a [routerLink]="item.link" routerLinkActive="active"
                                                    class="menu-item-link">
                                                    <span class="icon-wrapper"><i [class]="item.icon"></i></span>
                                                    <span class="label-text">{{ item.label }}</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </ng-container>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
            <div class="col-lg-9 col-xl-10">
                <div class="maindiv w-100">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- user dashboard area end -->
