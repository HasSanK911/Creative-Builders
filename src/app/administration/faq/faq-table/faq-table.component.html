<div class="dash-board-content-area-wrappper mt--30 mt_sm--0 mt_md--0">

    <div
        class="single-card-dashboard account-info box-dashboard-dashboard d-flex align-items-center justify-content-between">
        <h3 class="title title-top-primary"><i class="fa-solid fa-circle-question"></i> FAQs</h3>
        <a routerLink="../add-faq" class="tmp-btn btn-primary hover-icon-reverse btn-sm">
            <span class="icon-reverse-wrapper">
                <span class="btn-text">Add FAQ</span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
                <span class="btn-icon"><i class="fa-solid fa-add"></i></span>
            </span>
        </a>
    </div>
    <div class="single-card-dashboard account-info box-dashboard-dashboard">

        <table class="invers-table table table-borderless">
            <thead>
                <tr>
                    <th>Question</th>
                    <th>Answer</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngIf="loading">
                    <td colspan="3" class="text-center">Loading FAQs...</td>
                </tr>
                <tr *ngIf="error">
                    <td colspan="3" class="text-center text-danger" style="white-space: pre-line;">{{ error }}</td>
                </tr>
                <tr *ngIf="!loading && !error && faqs.length === 0">
                    <td colspan="3" class="text-center">No FAQs found.</td>
                </tr>
                <tr *ngFor="let faq of faqs">
                    <th>{{ faq.question }}</th>
                    <td>{{ faq.answer.length > 100 ? (faq.answer | slice:0:100) + '...' : faq.answer }}</td>
                    <td>
                        <div class="d-flex gap-3">
                            <a [routerLink]="['../add-faq']" [queryParams]="{ id: faq.id }"
                                class="cursor-pointer d-flex gap-1 align-items-center text-primary">
                                <i class="fa-regular fa-pen-to-square"></i> Edit
                            </a>
                            <a href="javascript:void(0)"
                                class="cursor-pointer d-flex gap-1 align-items-center text-danger"
                                (click)="deleteFaq(faq.id!)">
                                <i class="fa-light fa-trash-can"></i> Delete
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>
