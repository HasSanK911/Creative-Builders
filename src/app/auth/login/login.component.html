  <div class="tmp-bread-crumb-area bg-breadcrumb gradient-breadcrumb-1">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <!-- bread crumb inner wrapper -->
                    <div class="breadcrumb-inner ptb--100 ptb_sm--100 text-center">
                        <h1 class="title">Login</h1>
                        <div class="meta">
                            <a (click)="gotoHome()" class="prev">Home</a>
                            <span><i class="fa-regular fa-chevron-right"></i></span>
                            <a href="javascript:void(0)" class="next">Login</a>
                        </div>
                    </div>
                    <!-- bread crumb inner wrapper end -->
                </div>
            </div>
        </div>
    </div>
<div class="tmp-login-area py-5">
    <div class="container-3">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="login-registration-area-wrapper">
                    <div class="d-flex flex-column align-items-center">
                        <p class="h4 text-dark text-center mb-0">Login into your account</p>
                        <span class="mb-4 text-center w-100">Please enter your email and password to login into your account</span>
                    </div>
                    <form (ngSubmit)="login()">
                        <div class="single-input">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Email" required
                                autocomplete="username" [(ngModel)]="email">
                        </div>
                        <div class="single-input">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Password*" required
                                autocomplete="current-password" [(ngModel)]="password">
                        </div>

                        <!-- The theme styles form inputs as full-width 50px-tall text fields and takes
                             them out of flow with position:absolute, which would collapse the checkbox
                             into a sliver underneath its own label. Pin it back into the flex row. -->
                        <div class="d-flex align-items-center gap-2 mb--20">
                            <input type="checkbox" id="rememberMe" name="rememberMe" [(ngModel)]="rememberMe"
                                style="position: static; width: 16px; height: 16px; min-height: 0; flex: 0 0 auto; margin: 0; padding: 0; cursor: pointer;">
                            <label for="rememberMe" class="mb-0" style="cursor: pointer;">Remember me</label>
                        </div>

                        <div *ngIf="error" class="alert alert-danger py-2 mb--20" role="alert"
                            style="color: #dc3545; background: rgba(220,53,69,.08); border-radius: 6px; padding: 10px 14px; white-space: pre-line;">
                            {{ error }}
                        </div>

                        <button type="submit" [disabled]="loading"
                            class="tmp-btn btn-primary hover-icon-reverse mw-100">
                            <span class="icon-reverse-wrapper">
                                <span class="btn-text">{{ loading ? 'Logging in...' : 'Log In' }}</span>
                                <span class="btn-icon"><i class="fa-solid fa-arrow-right"></i></span>
                                <span class="btn-icon"><i class="fa-solid fa-arrow-right"></i></span>
                            </span>
                        </button>


                    </form>

                    <!-- Secondary action: leave the admin login and return to the public site.
                         Styled as a muted back link so it never competes with the orange Log In button. -->
                    <div class="text-center mt-3">
                        <a (click)="gotoHome()" href="javascript:void(0)" class="back-to-site">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Back to main website</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
